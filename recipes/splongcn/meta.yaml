# Draft bioconda recipe (submit to bioconda/bioconda-recipes after the v0.1.0 release; fill in sha256 of the tarball)
{% set version = "0.1.0" %}

package:
  name: splongcn
  version: {{ version }}

source:
  url: https://github.com/ljwharbers/scncall/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_SHA256

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install ./python --no-deps --no-build-isolation -vv
  entry_points:
    - splongcn = splongcn.cli:main
  run_exports:
    - {{ pin_subpackage("splongcn", max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    - python >=3.10
    - pysam >=0.22
    - numpy >=1.24
    - scipy >=1.10
    - pandas >=2.0
    - h5py >=3.8
    - anndata >=0.10
    - pyyaml >=6

test:
  imports:
    - splongcn
  commands:
    - splongcn --help
    - splongcn run --help

about:
  home: https://github.com/ljwharbers/scncall
  license: MIT
  license_file: python/LICENSE
  summary: Per-cell depth, read-phased alleles and fragment tables from SPLONGGET single-cell long-read DNA BAMs (extraction layer of scncall)
