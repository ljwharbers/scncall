name: container

# Builds the scncall image (R + Python + htslib) and pushes it to the GitHub container registry on tags (and on
# manual runs). Apptainer users: apptainer pull docker://ghcr.io/<owner>/scncall:<tag>
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scncall
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          load: true
          tags: scncall:test
      - name: smoke test (simulated data through the command line)
        run: docker run --rm -v "$PWD/tools:/tools:ro" scncall:test bash /tools/smoke_test.sh /tmp/smoke
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
